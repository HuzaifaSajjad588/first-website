<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Registration Form</h1>

    <form>
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" required>

        <label for="father-name">Father's Name</label>
        <input type="text" id="father-name" name="father-name" required>

        <label for="registration-number">Registration Number</label>
        <input type="text" id="registration-number" name="registration-number" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>

        <label for="date-of-birth">Date of Birth</label>
        <input type="date" id="date-of-birth" name="date-of-birth" required>

        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="female" required> Female</label>
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </fieldset>

        <label for="department">Department</label>
        <select id="department" name="department" required>
            <option value="">Select your department</option>
            <option value="BSSE">BSSE</option>
            <option value="BSAI">BSAI</option>
            <option value="BSDS">BSDS</option>
            <option value="BSCS">BSCS</option>
        </select>

        <label for="semester">Semester</label>
        <select id="semester" name="semester" required>
            <option value="">Select your semester</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
        </select>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="address">Permanent Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="profile-picture">Profile Picture</label>
        <input type="file" id="profile-picture" name="profile-picture" accept="image/*">

        <label><input type="checkbox" name="terms" required> I agree to the terms and conditions</label>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
